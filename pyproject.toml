[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "embedforge"
version = "1.0.0"
description = "Unified multimodal embedding + retrieval framework (EmbeddingGemma 2 direction): one space for text/code/image/audio, Matryoshka any-width embeddings, late interaction, on-device quantization. Zero-dependency."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "embedforge contributors" }]
keywords = ["embedding", "multimodal", "matryoshka", "retrieval", "quantization", "late-interaction", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/huzjie/embedforge"

[tool.setuptools.packages.find]
include = ["embedforge*"]
